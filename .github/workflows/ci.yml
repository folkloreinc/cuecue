name: CI

on:
    push:
        branches: [develop, master]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    checks:
        name: Format, lint and changeset
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Check formatting
              run: npm run format:check

            - name: Lint
              run: npm run lint

            # "Version packages" pull requests consume the changesets instead of adding one: the
            # Release workflow opens them from changeset-release/* branches, and a maintainer may
            # open one by hand with that title.
            - name: Check for a changeset
              if: >-
                  github.event_name == 'pull_request' &&
                  !startsWith(github.head_ref, 'changeset-release/') &&
                  !startsWith(github.event.pull_request.title, 'Version packages')
              run: npx changeset status --since=origin/${{ github.base_ref }}

    test:
        # The tests against a Pingpong server need Node 24: they are skipped on Node 22.
        name: Build and test on Node ${{ matrix.node }}
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Build
              run: npm run build

            - name: Test
              run: npm test
