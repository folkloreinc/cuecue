name: CI

on:
    push:
        branches: [develop, master]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    checks:
        name: Format, lint and changeset
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Check formatting
              run: npm run format:check

            - name: Lint
              run: npm run lint

            # "Version packages" pull requests consume the changesets instead of adding one: the
            # Release workflow opens them from changeset-release/* branches, and a maintainer may
            # open one by hand with that title.
            - name: Check for a changeset
              if: >-
                  github.event_name == 'pull_request' &&
                  !startsWith(github.head_ref, 'changeset-release/') &&
                  !startsWith(github.event.pull_request.title, 'Version packages')
              run: npx changeset status --since=origin/${{ github.base_ref }}

    test:
        # The tests against a Pingpong server need Node 24: they are skipped on Node 22.
        name: Build and test on Node ${{ matrix.node }}
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Build
              run: npm run build

            - name: Test
              run: npm test

    test-mysql:
        name: Test the MySQL store on MySQL 8.4
        runs-on: ubuntu-24.04
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: cuecue_test
                    MYSQL_USER: cuecue
                    MYSQL_PASSWORD: cuecue
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "mysqladmin ping --host 127.0.0.1 --user cuecue --password=cuecue"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Migrate
              run: npm run migrate:up -w @cuecue/store-mysql
              env:
                  MYSQL_HOST: 127.0.0.1
                  MYSQL_PORT: 3306
                  MYSQL_USER: cuecue
                  MYSQL_PASSWORD: cuecue
                  MYSQL_DB: cuecue_test

            - name: Test
              run: npx vitest run packages/store-mysql
              env:
                  MYSQL_TEST_HOST: 127.0.0.1
                  MYSQL_TEST_PORT: 3306
                  MYSQL_TEST_USER: cuecue
                  MYSQL_TEST_PASSWORD: cuecue
                  MYSQL_TEST_DB: cuecue_test
