name: Release

# Publishes to npm the packages whose version isn't on npm yet, when a v* tag is pushed, with
# trusted publishing (no npm token). npm trusts this file by name: renaming it breaks publishing
# (see "Releases" in README.md).
on:
    push:
        tags:
            - 'v*'

permissions: {}

concurrency:
    group: ${{ github.workflow }}

jobs:
    publish:
        name: Publish to npm
        # Restrict who can publish with the `npm` environment's protection rules (Settings →
        # Environments). The trusted publisher of each package on npmjs.com names it.
        environment: npm
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Check that the tag is the version
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  version="v$(node -p "require('./lerna.json').version")"
                  if [ "$TAG" != "$version" ]; then
                      echo "The tag $TAG isn't the version in lerna.json ($version)." >&2
                      exit 1
                  fi

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Build
              run: npm run build

            - name: Test
              run: npm test

            - name: Publish packages
              run: npx lerna publish from-package --yes
